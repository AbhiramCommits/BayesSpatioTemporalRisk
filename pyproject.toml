[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bstr"
version = "0.1.0"
description = "Bayesian hierarchical spatio-temporal risk model for a simulated autonomous-vehicle fleet"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyarrow>=15",
    "pymc>=5,<6",
    "arviz>=0.20",
    "h5netcdf>=1.3",
    "statsmodels>=0.14",
    "geopandas>=1.0",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "pyspark>=4.0,<5",
]

[project.scripts]
bstr-risk-readout = "bstr.readout:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running recovery test, excluded in CI with -m 'not slow'",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
